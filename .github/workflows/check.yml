name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.23'
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: skills/harness-audit/uv.lock
      - uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3
        with:
          version: '3.51.1'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/harness-city/package-lock.json
      - run: task setup
      - run: npm exec --prefix apps/harness-city -- playwright install --with-deps chromium
      - run: task check
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: failure()
        with:
          name: synthetic-city-browser-failures
          path: |
            apps/harness-city/test-results/
            apps/harness-city/playwright-report/
          if-no-files-found: ignore
          retention-days: 7