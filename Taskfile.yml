version: '3'

env:
  UV_FROZEN: '1'

tasks:
  default:
    cmds:
      - task --list
  setup:
    desc: Install the locked audit and browser development environments
    cmds:
      - task --dir skills/harness-audit setup
      - task: app:setup
  check:
    desc: Check unchanged audit code, demo conversion and standalone packaging
    cmds:
      - task --dir skills/harness-audit check
      - uv run --directory skills/harness-audit ruff check ../../tools ../../tests
      - uv run --directory skills/harness-audit ruff format --check ../../tools ../../tests
      - task: tools:test
      - task: app:check
      - task: app:test
      - python3 tools/check.py
  precommit:
    desc: Fast pre-commit gate (lint and format of tools/tests, extraction and docs checks)
    cmds:
      - uv run --directory skills/harness-audit ruff check ../../tools ../../tests
      - uv run --directory skills/harness-audit ruff format --check ../../tools ../../tests
      - python3 tools/check.py
  hooks:install:
    desc: Enable the repo's Git hooks for this clone
    cmds:
      - git config core.hooksPath .githooks
  tools:test:
    desc: Test repository quality gates and audit-history receipts
    cmds:
      - uv run --directory skills/harness-audit python -m unittest discover -s ../../tests -p 'test_*.py' -v
  app:setup:
    desc: Install the locked browser-test package and matching Chromium
    cmds:
      - npm --prefix apps/harness-city ci --ignore-scripts
      - npm exec --prefix apps/harness-city -- playwright install chromium
  app:test:
    desc: Run synthetic city tests in real desktop and mobile Chromium
    cmds:
      - python3 apps/harness-city/tools/build_standalone.py --offline --airport -o apps/harness-city/dist/airport-test.html
      - python3 tools/offline_fonts.py apps/harness-city/dist/airport-test.html
      - npm --prefix apps/harness-city test -- {{.CLI_ARGS}}
  demo:
    desc: Regenerate the explicitly synthetic city dataset
    cmds:
      - uv run --directory skills/harness-audit python ../../tools/make_demo.py
  app:check:
    desc: Validate deterministic synthetic report conversion
    cmds:
      - uv run --directory skills/harness-audit python ../../tools/make_demo.py --check
      - task: app:build
  app:build:
    desc: Build online and offline standalone HTML from the current data
    cmds:
      - python3 apps/harness-city/tools/build_standalone.py
      - python3 apps/harness-city/tools/build_standalone.py --offline -o apps/harness-city/dist/offline.html
      - python3 tools/offline_fonts.py apps/harness-city/dist/offline.html
  serve:
    desc: Serve Harness City locally; override PORT when needed
    cmds:
      - python3 -m http.server ${PORT:-8001} --bind 127.0.0.1 --directory apps/harness-city
  integrity:
    desc: Verify copied runtime files against the extraction baseline
    cmds:
      - python3 tools/check.py --integrity-only