[project]
name = "harness-audit"
version = "1.2.0"
description = "Read-only audit of how well a repository equips AI agents and humans to work in it"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "E731", "B905", "UP037"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that clone or hit the network (none today)"]
