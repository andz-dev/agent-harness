<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Infrastructure Level Vote</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky level legend on top, area index on the left, one scrolling column per area with reference grid and vote rows. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#14181f; --muted:#5b6472; --line:#d9dde4; --accent:#0e6f79; --accent-ink:#ffffff;
  --l0:#b3402e; --l1:#a8680f; --l2:#2a7a66; --l3:#1d5ca6; --code:#eef0f4; --sel:#e3f1f2;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --surface:#171c23; --ink:#e8ecf2; --muted:#9aa4b2; --line:#2a313b; --accent:#4fb6c0; --accent-ink:#06191c;
  --l0:#ef8a78; --l1:#e0a94e; --l2:#5fc3a8; --l3:#7fb2ee; --code:#1f252e; --sel:#18343a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1318; --surface:#171c23; --ink:#e8ecf2; --muted:#9aa4b2; --line:#2a313b; --accent:#4fb6c0; --accent-ink:#06191c;
  --l0:#ef8a78; --l1:#e0a94e; --l2:#5fc3a8; --l3:#7fb2ee; --code:#1f252e; --sel:#18343a; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;justify-content:space-between}
h1{font-size:18px;margin:0;font-weight:600;letter-spacing:-.01em}
.progress{font:500 12px var(--mono);color:var(--muted)}
.progress b{color:var(--ink)}
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.lv{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:4px;padding:6px 8px;background:var(--surface);min-width:0}
.lv b{font:600 12px var(--mono);color:var(--c)}
.lv span{display:block;font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;margin-top:20px}
nav.index{position:sticky;top:150px;align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 170px);overflow:auto}
nav.index a{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:4px;color:var(--ink);text-decoration:none;font-size:13px}
nav.index a:hover{background:var(--sel)}
nav.index a span{font:12px var(--mono);color:var(--muted)}
nav.index a.done span{color:var(--l2)}
nav.index small{margin:10px 8px 2px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
section.area{margin-bottom:44px;min-width:0}
section.area h2{font-size:17px;margin:0 0 2px;font-weight:600}
section.area .sub{color:var(--muted);margin:0 0 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.col{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:4px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.col h3{margin:0;font:600 12px var(--mono);color:var(--c);letter-spacing:.02em}
.col h3 span{color:var(--muted);font-weight:400}
.col ul{margin:0;padding-left:16px;font-size:12.5px}
.col li{margin-bottom:3px}
.col li.gate::marker{content:"◆ ";color:var(--c)}
.col .none{font-size:12.5px;color:var(--muted);margin:0}
pre{margin:0;background:var(--code);border-radius:3px;padding:7px 8px;font:11.5px/1.45 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.why{font-size:12px;color:var(--muted);margin:0}
.keynote{font-size:12px;color:var(--muted);margin:8px 0 14px}
.votes{margin-top:16px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.votes h3{margin:0;padding:8px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.who b{font-weight:600}
.who .facts{font:11.5px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.pick{display:flex;gap:4px}
.pick button{font:500 13px var(--mono);min-width:38px;height:34px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;cursor:pointer}
.pick button:hover{border-color:var(--accent)}
.pick button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--accent-ink)}
.pick button.skip{min-width:auto;padding:0 8px;font:12px var(--sans);color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:12px;color:var(--muted);margin-top:6px}
#status{font:12px var(--mono);color:var(--muted)}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.index{position:static;flex-direction:row;flex-wrap:wrap;max-height:none;gap:4px}
  nav.index small{display:none}
  nav.index a{border:1px solid var(--line);background:var(--surface)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  html{scroll-padding-top:200px}
}
@media (max-width:520px){
  .legend{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){button{transition:background .12s,border-color .12s}}
.tool{font:12px var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;padding:2px 8px;cursor:pointer}
.tool-chip{font:500 12px var(--mono);color:var(--muted);align-self:center;padding:0 6px}
</style>
</head>

s no level-1 check, so any Compose file counts at least L1."},{"level":1,"code":"services:\n  db:\n    image: postgres\n    environment:\n      POSTGRES_PASSWORD: hunter2","why":"Starting point: a working file, but unpinned and with a literal secret (blocks L2)."},{"level":2,"code":"image: postgres:16.3\nenvironment:\n  POSTGRES_PASSWORD: ${DB_PASSWORD}\n.env.example committed, .env ignored","why":"Pinned images, no literal secrets, env example present."},{"level":3,"code":"healthcheck:\n  test: [\"CMD\", \"pg_isready\"]\n# CI: docker compose config","why":"Every service has a healthcheck and the file is validated in CI."}]},{"key":"devcontainer","name":"Devcontainer","levels":[{"level":1,"checks":[{"id":"INF-V01","gate":true,"title":"devcontainer.json parses (JSON with comments)"},{"id":"INF-V03","gate":true,"title":"A create or post-create command prepares the environment"}]},{"level":2,"checks":[{"id":"INF-V02","gate":false,"title":"Image and features are pinned"},{"id":"INF-V04","gate":false,"title":"The setup command calls the repository's own runner or installer"},{"id":"INF-V05","gate":false,"title":"Editor extensions or settings are declared"}]},{"level":3,"checks":[{"id":"INF-V06","gate":false,"title":"CI builds the devcontainer"}]}],"examples":[{"level":0,"code":"{ \"image\": \"ubuntu\" }   // broken JSON or no setup","why":"devcontainer.json does not parse, or nothing prepares the environment."},{"level":1,"code":"{ \"image\": \"mcr.microsoft.com/devcontainers/base:ubuntu\",\n  \"postCreateCommand\": \"npm ci\" }","why":"Parses and a create command prepares the environment."},{"level":2,"code":"\"image\": \"...base:1-ubuntu-22.04\"  // pinned\n\"features\": { \".../node:1\": {} }\n\"postCreateCommand\": \"task setup\"\n\"customizations\": { \"vscode\": { \"extensions\": [...] } }","why":"Pinned image and features, calls the repo's own runner, editor settings declared."},{"level":3,"code":"# CI: devcontainers/ci builds the devcontainer","why":"The devcontainer is built in CI, so it cannot rot unnoticed."}]},{"key":"terraform","name":"Terraform","levels":[{"level":1,"checks":[{"id":"INF-T01","gate":true,"title":"Provider lock file (.terraform.lock.hcl) is committed"},{"id":"INF-T02","gate":true,"title":"required_providers declares version constraints"},{"id":"INF-T06","gate":true,"title":"No state files or tfvars with values are tracked"}]},{"level":2,"checks":[{"id":"INF-T03","gate":false,"title":"fmt, validate or tflint runs in CI or a hook"},{"id":"INF-T04","gate":false,"title":"A plan runs in CI"}]},{"level":3,"checks":[{"id":"INF-T05","gate":false,"title":"A security scanner (tflint, trivy, tfsec, checkov) is configured or runs in CI"},{"id":"INF-T07","gate":false,"title":"A remote backend or cloud block is declared"}]}],"examples":[{"level":0,"code":"main.tf   (no .terraform.lock.hcl)\nterraform.tfstate tracked in git","why":"Any failed gate (lock file, version constraints, state or tfvars with values) keeps the area at L0."},{"level":1,"code":".terraform.lock.hcl committed\nrequired_providers { aws = { version = \"~> 5.0\" } }\nno state files tracked","why":"Reproducible and clean; nothing runs automatically yet."},{"level":2,"code":"# CI\nterraform fmt -check && terraform validate\nterraform plan   # on every pull request","why":"fmt, validate or tflint plus a plan run in CI."},{"level":3,"code":"# CI: trivy / tfsec / checkov\nbackend \"s3\" { ... }","why":"Security scanner in CI and a remote backend or cloud block."}]},{"key":"bicep","name":"Bicep","levels":[{"level":1,"checks":[{"id":"INF-B01","gate":true,"title":"bicepconfig.json configures the linter"},{"id":"INF-B02","gate":false,"title":"Parameter files exist (.bicepparam or parameters.json)"}]},{"level":2,"checks":[{"id":"INF-B03","gate":false,"title":"bicep build or lint runs in CI or a hook"},{"id":"INF-B04","gate":false,"title":"A what-if or validate step runs in CI"},{"id":"INF-B05","gate":false,"title":"Secret-like parameters are marked @secure()"}]},{"level":3,"checks":[{"id":"INF-B06","gate":false,"title":"No preview API versions"}]}],"examples":[{"level":0,"code":"main.bicep   (no bicepconfig.json)","why":"The gate needs a bicepconfig.json that configures the linter."},{"level":1,"code":"bicepconfig.json   (linter rules)\nmain.bicepparam","why":"Linter configured and parameter files exist."},{"level":2,"code":"# CI: az bicep build\n# CI: az deployment group what-if\n@secure() param adminPassword string","why":"Build or lint, what-if or validate, secrets marked @secure()."},{"level":3,"code":"resource x 'Microsoft.Web/sites@2023-12-01'   // stable API versions only","why":"No preview API versions in use."}]},{"key":"kubernetes","name":"Kubernetes / Helm","levels":[{"level":1,"checks":[{"id":"INF-K06","gate":true,"title":"No Secret manifest with literal data"}]},{"level":2,"checks":[{"id":"INF-K01","gate":false,"title":"Container images are pinned to a tag or digest"},{"id":"INF-K02","gate":false,"title":"Containers set resource limits"},{"id":"INF-K05","gate":false,"title":"Manifests are validated in CI (kubeconform, helm lint, kustomize build, conftest, dry-run)"}]},{"level":3,"checks":[{"id":"INF-K03","gate":false,"title":"Containers run non-root (securityContext)"},{"id":"INF-K04","gate":false,"title":"Readiness and liveness probes are defined"},{"id":"INF-K07","gate":false,"title":"Helm chart has values.schema.json"}]}],"examples":[{"level":0,"code":"kind: Secret\ndata:\n  password: c2VjcmV0","why":"A Secret manifest with literal data fails the level-1 gate."},{"level":1,"code":"Secrets come from an external store or sealed secrets","why":"Gate passes. Images may be unpinned and have no limits."},{"level":2,"code":"image: app:1.4.2\nresources:\n  limits: { cpu: 500m, memory: 256Mi }\n# CI: kubeconform or helm lint","why":"Pinned images, limits, manifests validated in CI."},{"level":3,"code":"securityContext:\n  runAsNonRoot: true\nreadinessProbe / livenessProbe set\nvalues.schema.json (Helm chart)","why
